name: NIST Release Check

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_LINK_MODE: copy
  NYDO_RELEASE_EVIDENCE_DIR: /tmp/nydo-nist-evidence

jobs:
  nist-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run NIST release check (--json)
        run: ./scripts/nist-release-check.sh --json
