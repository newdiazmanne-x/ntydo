[project]
name = "si-agent"
version = "0.1.0"
description = "Cross-platform local-first HITL agent runner for NTYDO using uv and hatchling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
si-agent = "si_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/si_agent"]
