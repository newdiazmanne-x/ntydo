[project]
name = "si-router"
version = "0.1.0"
description = "Auto-aware computability and MoE scaling router CLI for NTYDO"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
si-router = "si_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/si_router"]
